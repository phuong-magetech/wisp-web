<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Disable caching. The glasses browser aggressively caches pages opened via QR
         code and offers no user-facing "force refresh", so a stale build can get stuck
         on-device. These directives force a fresh fetch on every load. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=600, height=600, initial-scale=1.0" />
    <!-- Replace with a brief, game-specific description of what this game is. -->
    <meta name="description" content="A quiet companion on your lens, fed by your focus." />
    <!-- Identifies the page as a Meta Display Glasses (MRBD) webapp so the device routes
         D-pad / EMG input to it. Keep content="yes" verbatim. -->
    <meta name="mrbd-web-app-capable" content="yes" />
    <!-- Records the scaffolding skill and its version, so a released game says what built it.
         Stamped by the create skill and re-stamped on every framework update — don't hand-edit
         it, and don't remove it (`npm run validate` checks it). -->
    <meta
      name="generator"
      content="create-webapp-game 1.0.1 (https://github.com/facebook/meta-wearables-webapp)"
    />
    <!-- Localized text is populated from src/i18n/ at boot. data-i18n keys map to en.json;
         see the plugin's docs/localization.md. -->
    <title data-i18n="title">Wisp</title>
    <!-- Raster favicon (192x192 PNG), served from public/ and copied verbatim into the build. -->
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png" />
    <!-- Critical CSS, inlined: the black (see-through) page and a static glow where Wisp will
         appear. The first paint then waits only for this HTML and the small style.css, not for
         the ~150 KB script, which takes seconds over the glasses' link. main.ts removes
         #boot-glow once the real scene has drawn. -->
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #boot-glow {
        position: absolute;
        left: 234px;
        top: 204px;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        /* Core radius 36px of a 66px halo: the same proportions as src/models.ts. */
        background: radial-gradient(circle, #8fc9dd 0 54%, #11415c 56% 100%);
        opacity: 0.6;
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- The 600x600 stage. On the device the viewport IS 600x600; on desktop we center a
         fixed 600x600 stage so the framing matches the glasses. Everything (canvas + DOM
         HUD overlay) lives inside #game-root so nothing escapes the 600x600 bounds. -->
    <div id="game-root">
      <!-- The game world: Wisp's shapes, as CSS circles placed by src/hud/CssRenderer.ts. -->
      <div id="world" aria-hidden="true"></div>
      <!-- Boot placeholder: Wisp's resting spot (center 300,270; halo radius 66px), drawn dim. -->
      <div id="boot-glow" aria-hidden="true"></div>

      <!-- DOM HUD overlay above the canvas. Text/menus go here, NOT in WebGL.
           See the plugin's threejs-vs-dom guidance. -->
      <div id="hud">
        <!-- Filled at runtime by src/hud/Hud.ts: the time left is a bare number, the rest comes
             from src/i18n/ via t(). Leave these empty. -->
        <div id="timer"></div>
        <div id="credit"></div>
        <!-- The two controls, focusable and announced. Gestures never go through the DOM: the
             D-pad (left/right) moves the selection and the index pinch presses it, both via the
             InputManager, and Hud.ts moves browser focus to match. [Focus] is also a real link to
             the focus screen's URL, so any standard activation is an ordinary browser navigation
             that ScreenHistory routes (it carries no listener). While a session runs, Hud.ts drops
             the href and it reads "Stop"; tabindex keeps it focusable. Labels come from src/i18n/. -->
        <div id="controls">
          <a id="btn-focus" class="control" href="#focus" tabindex="0"></a>
          <button id="btn-pet" class="control" type="button"></button>
        </div>
        <div id="hint"></div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
